name: Arapal Release Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/release-certification

permissions:
  contents: read

jobs:
  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Record candidate identity
        run: |
          mkdir -p artifacts/release-audit/logs
          printf '{"sha":"%s","ref":"%s","run_id":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" \
            > artifacts/release-audit/run-identity.json

      # Release-critical gates. Each records its exit code; the job fails at the
      # end if ANY of them failed. Nothing is swallowed — a red gate is a red
      # release. (The previous harness ran every gate under `set +e; return 0`,
      # so the job passed no matter what failed — S3-006.)
      - name: Build (exact candidate)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Audit suite
        run: npm run audit:suite

      - name: Unit — data
        run: npm run test:data

      - name: Rendered QA (production Floor gate)
        run: npm run qa

      - name: Visual regression
        run: npm run vr

      - name: Behaviour
        run: npm run test:behaviour

      # Fail-closed exact-candidate release evidence: builds dist, binds every
      # artifact to the SHA + built-asset hash, serves the BUILT dist, and
      # captures the required journeys at 390/768/1280/1440. Unreachable, wrong
      # route, page/request error, or timeout fails this step.
      - name: Fail-closed release evidence (built dist)
        run: npm run audit:evidence

      # Prove the gate bites: routing a required journey to a nonexistent screen
      # MUST turn the capture red. This step exits 0 only when that happens.
      - name: Prove fail-closed
        run: npm run audit:evidence:prove

      - name: Rebuild reviewed evidence index for the real run
        if: always()
        run: |
          npm run audit:evidence || true

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arapal-release-audit-${{ github.sha }}
          path: artifacts/release-audit
          if-no-files-found: warn
          retention-days: 30
